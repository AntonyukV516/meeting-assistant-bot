name: Build and Test

on:
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Checkstyle (Main)
        run: ./gradlew checkstyleMain

      - name: Run Checkstyle (Tests)
        run: ./gradlew checkstyleTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/
          retention-days: 7

      - name: Generate JaCoCo report
        run: ./gradlew jacocoTestReport

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Run tests with H2
        run: ./gradlew test -Dspring.profiles.active=test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/

  docker-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name test-postgres \
            -e POSTGRES_DB=meeting_bot_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=bot_password \
            -p 5432:5432 \
            postgres:16-alpine

          echo "⏳ Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec test-postgres pg_isready -U postgres > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Create application user in PostgreSQL
        run: |
          echo "👤 Creating bot_user..."
          docker exec test-postgres psql -U postgres -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'bot_user') THEN
                CREATE USER bot_user WITH PASSWORD 'bot_password';
              END IF;
            END
            \$\$;

            GRANT ALL PRIVILEGES ON DATABASE meeting_bot_db TO bot_user;
          "
          
          docker exec test-postgres psql -U postgres -d meeting_bot_db -c "
            GRANT ALL ON SCHEMA public TO bot_user;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO bot_user;
          "

      - name: Build Docker image
        run: docker build -t meeting-bot:ci-${{ github.sha }} .

      - name: Test migrations
        run: |
          echo "🚀 Testing Flyway migrations..."

          # Запускаем контейнер с токеном
          docker run -d --name migration-test \
            --link test-postgres:postgres \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://test-postgres:5432/meeting_bot_db \
            -e SPRING_DATASOURCE_USERNAME=bot_user \
            -e SPRING_DATASOURCE_PASSWORD=bot_password \
            -e BOT_TOKEN=${{ secrets.BOT_TOKEN }} \
            -e BOT_USERNAME=${{ secrets.BOT_USERNAME }} \
            meeting-bot:ci-${{ github.sha }}

          # Ждём 10 секунд для применения миграций
          echo "⏳ Waiting for migrations to apply..."
          sleep 10

          # Проверяем, что контейнер всё ещё работает (не упал)
          if docker ps --filter "name=migration-test" --filter "status=running" | grep migration-test; then
            echo "✅ Migrations applied successfully!"
          else
            echo "❌ Container failed! Checking logs..."
            docker logs migration-test
            exit 1
          fi

          # Проверяем наличие таблиц в БД
          echo "🔍 Checking tables in database..."
          docker exec test-postgres psql -U postgres -d meeting_bot_db -c "
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public'
            ORDER BY table_name;
          "

          # Останавливаем тестовый контейнер
          docker stop migration-test
          docker rm migration-test

      - name: Run and health check with PostgreSQL
        run: |
          docker run -d --name meeting-bot-container -p 8080:8080 \
            --link test-postgres:postgres \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://test-postgres:5432/meeting_bot_db \
            -e SPRING_DATASOURCE_USERNAME=bot_user \
            -e SPRING_DATASOURCE_PASSWORD=bot_password \
            -e BOT_TOKEN=${{ secrets.BOT_TOKEN }} \
            -e BOT_USERNAME=${{ secrets.BOT_USERNAME }} \
            meeting-bot:ci-${{ github.sha }}

          echo "⏳ Waiting for application to start..."
          sleep 10

          MAX_RETRIES=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
          
            if curl -s http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "✅ Application is UP!"
              echo "🔍 Checking Actuator main endpoint..."
              curl -s http://localhost:8080/actuator > /dev/null && echo "✅ Actuator working!" || echo "⚠️ Actuator issue"
              break
            fi
          
            if [ $i -eq $MAX_RETRIES ]; then
              echo "❌ Health check failed after $MAX_RETRIES attempts!"
              echo "=== Application logs ==="
              docker logs meeting-bot-container
              echo "=== PostgreSQL logs ==="
              docker logs test-postgres
              exit 1
            fi
          
            sleep 5
          done
          
          echo "✅ All checks passed!"

      - name: Check image size
        run: |
          docker images meeting-bot:ci-${{ github.sha }}
          SIZE=$(docker images meeting-bot:ci-${{ github.sha }} --format "{{.Size}}" 2>/dev/null || echo "Unknown")
          echo "📦 Docker image size: $SIZE"

      - name: Cleanup
        if: always()
        run: |
          docker stop meeting-bot-container 2>/dev/null || true
          docker rm meeting-bot-container 2>/dev/null || true
          docker stop test-postgres 2>/dev/null || true
          docker rm test-postgres 2>/dev/null || true