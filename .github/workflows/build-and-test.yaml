name: Build and Test

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Checkstyle (Main)
        run: ./gradlew checkstyleMain

      - name: Run Checkstyle (Tests)
        run: ./gradlew checkstyleTest

      - name: Upload Checkstyle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-reports
          path: build/reports/checkstyle/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Run tests
        run: ./gradlew test

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/test-results/        

  docker-test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t meeting-bot:ci-${{ github.sha }} .

      - name: Run and health check
        run: |
          docker run -d -p 8080:8080 --name meeting-bot-container meeting-bot:ci-${{ github.sha }}
          
          echo "⏳ Waiting for application to start..."
          
          sleep 10
          
          echo "🔍 Checking health endpoint..."
          
          HEALTH_CHECK=$(curl --retry 5 --retry-delay 3 --retry-all-errors -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health)
          
          echo "Health check HTTP status: $HEALTH_CHECK"
          
          if [ "$HEALTH_CHECK" != "200" ]; then
            echo "❌ Health check failed! Container logs:"
            docker logs meeting-bot-container
            exit 1 
          fi
          
          echo "✅ Health check passed!"
          
          echo "🔍 Checking Actuator main endpoint..."
          curl -f http://localhost:8080/actuator || exit 1
          
          docker stop meeting-bot-container
          docker rm meeting-bot-container

      - name: Check image size
        run: |
          docker images meeting-bot:ci-${{ github.sha }}
          
          SIZE=$(docker images meeting-bot:ci-${{ github.sha }} --format "{{.Size}}")
          echo "📦 Docker image size: $SIZE"