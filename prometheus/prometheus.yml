global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'meeting-bot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['meeting-bot:8080']
    scrape_interval: 10s
    scrape_timeout: 5s
    relabel_configs:
      - source_labels: [job]
        target_label: application
        replacement: 'meeting-assistant-bot'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']