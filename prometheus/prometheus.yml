global:
  scrape_interval: 15s
  evaluation_interval: 15s


rule_files:

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'development'

  - job_name: 'meeting-bot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['meeting-bot:8080']
        labels:
          application: 'meeting-assistant-bot'
          environment: 'development'
          version: '1.0.0'

storage:
  tsdb:
    path: /prometheus
    retention: 15d